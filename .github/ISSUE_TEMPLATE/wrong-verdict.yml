name: Wrong verdict
description: The scanner flagged something that isn't exposed, or missed something that is.
labels: [detection]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong
      options:
        - False positive (flagged, but doesn't decode untrusted brotli)
        - False negative (decodes brotli, but wasn't flagged)
        - Wrong decoder status (vulnerable / patched / unconfirmed)
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: The code or setup
      description: A minimal snippet, project setting or hosting setup that reproduces it. Remove anything confidential.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Scanner output
      description: The relevant part of the report (`--verbose` or `--json`). Redact paths, app names and subscription IDs if needed.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: brotli-scan version and platform
      placeholder: 1.0.0, win-x64
    validations:
      required: true
